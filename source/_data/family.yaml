about:
  title: About Gill
  subtitle: Melbourne Family Photographer
  copy:
    - I'm a Melbourne-based family photographer with over 10 years of experience capturing natural, relaxed and genuine moments. My approach focuses on creating a comfortable experience where you can be yourselves while I gently guide you to create beautiful, natural images.
    - I specialise in Melbourne family photography that captures authentic connections and real emotion. Every family is different, which is why my sessions are designed to reflect your unique personalities and create timeless family portraits you will treasure for years.
    - I live in Melbourne’s eastern suburbs with my husband, our two children and our two dogs, and I truly understand how important it is to document the everyday moments that pass too quickly. This personal connection is what drives my passion for photographing families.
    - I have photographed families all across Melbourne and am always happy to travel. Whether your session takes place at home, outdoors, or somewhere meaningful to you, I work with you to find the perfect location.
    - Over the years I have specialised in maternity, newborn and family photography, as photographing people and their connections has always been what I love most. From brand new babies to growing families, I focus on creating natural portraits parents will always value.
    - My sessions are relaxed, fun and child-friendly. My goal is always to help everyone feel comfortable, help kids enjoy the experience, and deliver natural images that truly reflect your family.

my_approach:
  title: My approach to family photography
  blocks:
    - copy:
        - "My approach to family photography is simple: real moments always matter more than perfect poses. As a Melbourne family photographer, I focus on creating space for your family to interact naturally so I can capture the connection that already exists between you."
        - Many parents worry their children won't cooperate, but in my experience the best family portraits happen when kids are allowed to be themselves. Whether that means exploring, laughing, cuddling or being a little bit wild, these are the moments that truly reflect your family dynamic.
        - As a lifestyle photographer specialising in family photography in Melbourne, I work primarily with natural light and real environments rather than heavily styled setups. This allows your photos to feel timeless, warm and authentic rather than overly staged.
    - heading: Relaxed family photography sessions that feel natural
      copy:
        - Your session is designed to feel more like quality family time than a traditional photoshoot. We might walk, talk, play games, or simply spend time together while I document what unfolds naturally.
        - I know that many adults feel awkward in front of a camera, which is why I focus on creating a comfortable and relaxed atmosphere. With conversation, gentle direction and plenty of reassurance, most families quickly forget the camera is even there.
        - This natural approach is what many families look for when searching for a family photographer in Melbourne who creates honest and emotional images rather than stiff poses.
    - heading: Natural family portraits that tell your story
      copy:
        - Every family has their own rhythm, personality and way of showing love. My goal is always to capture your story in a way that feels true to you.
        - Some families are playful and energetic, others are quiet and affectionate, and many are a mix of both. There is no right or wrong way to show up at your session.
        - The families who connect most with my work are usually looking for natural family portraits Melbourne parents love - images that document this stage honestly and preserve how life feels right now.
    - heading: Why families choose my photography style
      copy:
        - Families often tell me they chose me because my work feels natural and relaxed rather than overly posed. They want photos that feel like their real life, just beautifully captured.
        - As one of many Melbourne family photographers, my focus has always been storytelling rather than perfection. I aim to create a collection of images that reflect your relationships, not just individual photos.
        - Years from now, these photographs become more than just pictures. They become reminders of personalities, relationships and the small everyday moments that change so quickly.
