about:
  title: About Gill
  subtitle: Melbourne Maternity Photographer
  copy:
    - I'm a Melbourne-based maternity photographer with over a decade of experience capturing the beauty and emotion of pregnancy. My approach is relaxed and natural, focusing on authentic moments and helping you feel confident and comfortable in front of the camera.
    - I love documenting this special stage as you prepare to welcome your baby. Every pregnancy is unique, and my goal is to create timeless maternity portraits that families will always look back on as an important part of their story.
    - My maternity and pregnancy photography sessions can take place in your home or at beautiful outdoor locations across Melbourne. Whether you want something intimate and personal or light-filled and scenic, I help you choose the perfect setting.
    - Many families book a maternity session as the beginning of their story, later returning for newborn and family photography as their baby grows. These sessions are designed to celebrate your connection and the excitement of this new chapter.
    - If you're looking for a maternity photographer in Melbourne who creates natural, elegant and meaningful pregnancy photos, I would love to help you document this incredible time.

my_approach:
  title: Natural maternity photography that celebrates your pregnancy
  blocks:
    - copy:
        - My maternity photography style focuses on capturing the quiet beauty of pregnancy in a natural and timeless way. As a Melbourne maternity photographer, I focus on connection, emotion and the anticipation that comes with preparing to meet your baby rather than dramatic posing.
        - Pregnancy can feel long while you're in it, but in reality it is such a short chapter. My goal is to create maternity portraits that allow you to remember not just how you looked, but how this season of life felt.
        - Whether this is your first baby or you are growing your family, these sessions are about documenting the beginning of a new story through natural pregnancy photography.
    - heading: A relaxed pregnancy photography experience
      copy:
        - Comfort is always my priority during maternity sessions. I understand from personal experience that pregnancy can be both exciting and physically demanding, which is why sessions are intentionally unhurried and flexible.
        - You never need modelling experience. I provide gentle guidance on positioning, flattering light and natural movement so you feel confident while still looking like yourself.
        - Many expecting mothers say they felt nervous beforehand but ended up genuinely enjoying their maternity photography experience because of the relaxed and supportive approach.
    - heading: Maternity portraits focused on connection
      copy:
        - While beautiful portraits of your bump are important, I also love capturing connection. This might include your partner, your children, or even quiet moments of reflection as you prepare for your baby's arrival.
        - These images often become even more meaningful after your baby arrives, as they show the beginning of your journey together.
        - Many clients who find me while searching for maternity photography in Melbourne later return for newborn sessions, allowing them to document both the anticipation and the arrival of their baby.
    - heading: Timeless maternity photography you'll always value
      copy:
        - My editing style is soft, natural and true to life so your images remain timeless. Trends change, but authentic emotion and natural light never go out of style.
        - The goal is always to create maternity photography that still feels just as meaningful decades from now as it does today, with a focus on genuine connection and beautiful natural light.
