about_subtitle: "Lifestyle photographer in Melbourne's Eastern suburbs"

about:
  - >-
    Hi, I'm Gill! Before I ever studied photography, I studied professional writing. This is so important to the way I approach each of my sessions, whether it be a <a href="/melbourne-maternity-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">maternity</a>, <a href="/melbourne-newborn-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">newborn</a> or <a href="/melbourne-family-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">family</a> session. I bring these creative writing skills with me as I get to tell your individual story through photographs.
  - >-
    I live in the <a href="/suburbs/" class="text-inherit no-underline hover:underline underline-offset-4">outer Eastern suburbs of Melbourne</a> with my husband, our 2 kids and our 2 dogs. I love being with my family so when I'm not working, that's where you'll find me!
  - "My lens has taken me to countless locations and homes throughout Melbourne, and I'm always eager to explore new settings that hold special meaning for you. Whether you have a beloved spot in mind or live in another part of Melbourne, I'm happy to travel and capture your story in the perfect location."
  - >-
    Over the years, I have photographed many different things but have always enjoyed photographing people the most. This is how <a href="/melbourne-maternity-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">maternity</a>, <a href="/melbourne-family-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">family</a> and <a href="/melbourne-newborn-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">newborn</a> sessions (and older babies too, of course!) have become my specialty.
  - "My approach to maternity, newborn, and family photography is all about capturing natural, genuine moments. I combine a relaxed atmosphere with subtle guidance, helping you feel comfortable while also maximising the beauty of the light and location. Many of my clients tell me they were surprised by how much they enjoyed their session, finding it far more comfortable and fun than they anticipated."
  - >-
    My <a href="/melbourne-family-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">family photography</a> sessions are very relaxed. I do my best to make sure everyone feels comfortable in front of the camera and your kids have fun. Have a question about booking? See the <a href="/photography-faqs-melbourne/" class="text-inherit no-underline hover:underline underline-offset-4">photography FAQs</a>.

tagline: "Capturing the beauty in everyday moments"
