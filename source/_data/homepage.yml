title: "Melbourne Family, Newborn & Maternity Photographer."

# Inline <a> tags are intentional for SEO; home intro/about partials render HTML unescaped.
intro: >-
  I'm a Melbourne-based <a href="/melbourne-maternity-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">maternity</a>, <a href="/melbourne-newborn-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">newborn</a> and <a href="/melbourne-family-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">family photographer</a> with over a decade of experience capturing love and joy between families. I absolutely love what I do and take a very relaxed approach to each of my sessions. Guiding you, making you laugh, and capturing the real you is my priority, as I understand that feeling natural in front of the camera isn't always easy. Each family has their own unique dynamic, and I love celebrating that in my images.

services_title: "Family, Newborn & Maternity Photographer in Melbourne"
services_subtitle: "Capturing the heart of your family story"
services_intro: >-
  As a Melbourne-based photographer specialising in <a href="/melbourne-maternity-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">maternity</a>, <a href="/melbourne-newborn-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">newborn</a>, and <a href="/melbourne-family-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">family photography</a>, I’ve spent over a decade documenting the beautiful, unscripted moments that make each family unique. My sessions are relaxed, playful, and guided—so even if you're not used to being in front of the camera, you’ll feel comfortable and at ease. Whether it’s the quiet bond between parents and a newborn, the joy of an expecting mum, or the laughter of siblings, I’m here to capture your story just as it unfolds—honestly and naturally. I also photograph <a href="/melbourne-wedding-photographer/" class="text-inherit no-underline hover:underline underline-offset-4">weddings and engagements</a> across Melbourne. Explore the <a href="/suburbs/" class="text-inherit no-underline hover:underline underline-offset-4">suburbs I serve</a>, read <a href="/melbourne-photography-tips/" class="text-inherit no-underline hover:underline underline-offset-4">Melbourne photography tips</a>, or see what families say in the <a href="/testimonials-from-photography-clients-in-melbourne/" class="text-inherit no-underline hover:underline underline-offset-4">client testimonials</a>.

